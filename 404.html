<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // 1. Get the current URL path (e.g., '/about')
      var path = window.location.pathname;

      // 2. Redirect to the root (index.html)
      //    We pass the path we wanted (like 'about') as a query parameter
      window.location.href = '/' + '?path=' + path.substring(1) + window.location.search;
    </script>
  </head>
  <body>
    If you are not redirected automatically, please <a href="/">click here</a>.
  </body>
</html>
